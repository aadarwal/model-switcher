# The nightly canary (scripts/canary.mjs): the NEWEST Codex and Claude Code
# from npm, checked against what ms keys on — no logins, no secrets. A
# scheduled or manual run that finds a failing check opens (or comments on)
# one issue per CLI version, "Canary: <tool> <version> breaks ms". A pull
# request that touches the canary runs it too, so a change to it is exercised
# before it lands; there it only fails the check, it never files an issue.
name: Canary

on:
  schedule:
    - cron: "37 7 * * *" # once a day, 07:37 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/canary.mjs
      - .github/workflows/canary.yml
      - src/compat.ts

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Install the latest Codex and Claude Code
        run: |
          npm install -g @openai/codex@latest @anthropic-ai/claude-code@latest
          codex --version
          claude --version
      - name: Contract checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUES: ${{ github.event_name != 'pull_request' && '--issues' || '' }}
        run: node --disable-warning=ExperimentalWarning --import tsx scripts/canary.mjs --json canary-report.json $ISSUES
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-report
          path: canary-report.json
          if-no-files-found: ignore
